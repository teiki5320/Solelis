name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Génère le module des articles « Conseils » (vérifie aussi leur format).
      - run: npm run conseils
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      # Vérifie que le site se construit aussi pour le Worker Cloudflare
      # (OpenNext) — sans rien déployer.
      - run: npx opennextjs-cloudflare build
