# Vérifie le site à chaque envoi ; sur main, le publie ensuite sur Cloudflare
# (Worker « solelis », solelis.com) si les secrets Cloudflare sont réglés.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: ${{ github.event_name == 'push' && 'publication' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # Génère le module des articles « Conseils » (vérifie aussi leur format).
      - run: npm run conseils
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      # Vérifie que le site se construit aussi pour le Worker Cloudflare
      # (OpenNext) — sans rien déployer.
      - run: npx opennextjs-cloudflare build
      # Les secrets ne sont donnés qu'aux étapes qui en ont besoin.
      - name: Vérifier la présence des secrets Cloudflare
        id: secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier le site."
          fi
      - name: Publier sur Cloudflare (solelis.com)
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
      - name: Prévenir Bing (IndexNow)
        if: steps.secrets.outputs.ok == 'true'
        run: node scripts/indexnow.mjs || echo "::warning::IndexNow n'a pas répondu"
